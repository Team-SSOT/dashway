services:
  postgres:
    image: postgres:18.3
    container_name: dashway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashway
      POSTGRES_USER: context_api
      POSTGRES_PASSWORD: context_api
    ports:
      - "5432:5432"
    volumes:
      - context-api-postgres-storage:/var/lib/postgresql
      # Postgres runs init scripts only when the data directory is created from an empty volume.
      - ./context-api/src/main/resources/db/ddl/ddl.sql:/docker-entrypoint-initdb.d/ddl.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context_api -d dashway"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashway-shared

  redis:
    image: redis:8.2
    container_name: dashway-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - context-api-redis-storage:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashway-shared

