  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: dashway-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    deploy:
      resources:
        limits:
          memory: 1g
    ports:
      - "7700:7700"
    volumes:
      - dashway-meilisearch-data:/meili_data
    networks:
      - dashway-shared

volumes:
  context-api-postgres-storage:
    name: context-api-postgres-storage
  context-api-redis-storage:
    name: context-api-redis-storage
#  dashway-neo4j-data:
