spring:
  application:
    name: context-api

  datasource:
    driver-class-name: org.postgresql.Driver
    username: context_api
    password: context_api
    url: jdbc:postgresql://localhost:5432/dashway

logging:
  level:
    web: debug
    org.springframework.security: debug

context-api:
  search:
    meilisearch:
      host: http://localhost:7700
      api-key: ""
      index-name: app_content
      connect-timeout-millis: 3000
      read-timeout-millis: 3000
  auth:
    issuer: context-api
    access-token-ttl: 604800
    refresh-token-ttl: 604800
    jwt-secret: "0123456789abcdef0123456789abcdef"
    cors-allowed-origins: ["*"]
    refresh-cookie:
      path: /graphql
      secure: true
      same-site: None
  install:
    bootstrap-enabled: false
    bootstrap-secret: ""

dashway:
  config:
    path: ${DASHWAY_CONFIG_PATH:}

redis:
  host: localhost
  port: 6379
