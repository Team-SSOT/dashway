services:
  context-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: context-api-backend:local
    container_name: context-api-server
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DASHWAY_CONFIG_PATH: /etc/dashway/dashway.config.json
      CONTEXT_API_INSTALL_BOOTSTRAP_ENABLED: ${CONTEXT_API_INSTALL_BOOTSTRAP_ENABLED:-false}
      CONTEXT_API_INSTALL_BOOTSTRAP_SECRET: ${CONTEXT_API_INSTALL_BOOTSTRAP_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - ../dashway.config.json:/etc/dashway/dashway.config.json:ro
    networks:
      - dashway-shared

networks:
  dashway-shared:
    external: true
    name: dashway-shared
