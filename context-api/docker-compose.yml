services:
  context-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: context-api-backend:local
    container_name: context-api-server
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dashway
      SPRING_DATASOURCE_USERNAME: context_api
      SPRING_DATASOURCE_PASSWORD: context_api
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CONTEXT_API_INSTALL_BOOTSTRAP_ENABLED: ${CONTEXT_API_INSTALL_BOOTSTRAP_ENABLED:-false}
      CONTEXT_API_INSTALL_BOOTSTRAP_SECRET: ${CONTEXT_API_INSTALL_BOOTSTRAP_SECRET:-}
    ports:
      - "8080:8080"
    networks:
      - dashway-shared

networks:
  dashway-shared:
    external: true
    name: dashway-shared
