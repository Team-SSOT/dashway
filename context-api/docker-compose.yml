services:
  context-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: context-api-backend:local
    container_name: context-api-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/context_api
      SPRING_DATASOURCE_USERNAME: context_api
      SPRING_DATASOURCE_PASSWORD: context_api
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"

  postgres:
    image: postgres:18.3
    container_name: context-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: context_api
      POSTGRES_USER: context_api
      POSTGRES_PASSWORD: context_api
    ports:
      - "5432:5432"
    volumes:
      - context-api-postgres-storage:/var/lib/postgresql
      # Postgres runs init scripts only when the data directory is created from an empty volume.
      - ./src/main/resources/db/ddl/ddl.sql:/docker-entrypoint-initdb.d/ddl.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context_api -d context_api"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2
    container_name: context-api-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - context-api-redis-storage:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Remove this volume, for example with `docker compose down -v`, to rerun `ddl.sql`.
  context-api-postgres-storage:
  context-api-redis-storage:
