version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: chat-backend:local
    container_name: chat-backend
    restart: unless-stopped
    environment:
      DASHWAY_APP_NAME: ${DASHWAY_APP_NAME:-chat}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/dashway}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-context_api}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-context_api}
      CHAT_CONTEXT_API_BASE_URL: ${CHAT_CONTEXT_API_BASE_URL:-http://context-api:8080}
    ports:
      - 12001:8080
    networks:
      - dashway-shared

networks:
  dashway-shared:
    external: true
    name: dashway-shared
