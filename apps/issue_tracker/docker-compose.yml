version: '3.8'

services:
  db:
    image: postgres:18.3
    environment:
      POSTGRES_USER: issue_tracker
      POSTGRES_PASSWORD: issue_tracker
      POSTGRES_DB: issue_tracker
    ports:
      - 5433:5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: issue-tracker-backend:local
    container_name: issue-tracker-backend
    restart: unless-stopped
    ports:
      - 12000:12000
    volumes:
      - .:/app
    depends_on:
      - db