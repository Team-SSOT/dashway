services:
  backend:
    build:
      context: ../..
      dockerfile: apps/issue_tracker/Dockerfile
    image: issue-tracker-backend:local
    container_name: issue-tracker-backend
    restart: unless-stopped
    environment:
      DASHWAY_APP_NAME: ${DASHWAY_APP_NAME:-issue-tracker}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/dashway}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-context_api}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-context_api}
      ISSUE_TRACKER_CONTEXT_API_BASE_URL: ${ISSUE_TRACKER_CONTEXT_API_BASE_URL:-http://context-api:8080}
    ports:
      - 12000:12000
    volumes:
      - ../../dashway.config.json:/etc/dashway/dashway.config.json:ro
    networks:
      - dashway-shared

networks:
  dashway-shared:
    external: true
    name: dashway-shared
